# PD disaggregation (KV transfer). Receives finished by the KV connector poll paths, blocks
# that failed to load back into the engine, and the per-step requests still
# waiting for remote KV. Each symbol is only hooked once; facade and worker
# methods that forward to each other are not both listed to avoid double count.

# Mooncake V2 reports request outcomes from the scheduler's aggregated stats.
- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake.connector:MooncakeBaseConnector.get_kv_connector_stats
  handler: vllm_ascend.observability.ms_metrics.handlers:mooncake_receive_stats_handler

# Finished receives from other connectors implementing get_transfer_results.
- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_connector:MooncakeConnector.get_transfer_results
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_finished_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.ascend_store_connector:AscendStoreConnector.get_transfer_results
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_finished_handler

# Blocks that failed to load. AscendStore is excluded: kvpool:load_error_blocks_total
# already covers it and both series would grow together.
- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake.connector:MooncakeBaseConnector.get_block_ids_with_load_errors
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_invalid_blocks_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_connector:MooncakeConnector.get_block_ids_with_load_errors
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_invalid_blocks_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_layerwise_connector:MooncakeLayerwiseConnector.get_block_ids_with_load_errors
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_invalid_blocks_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ucm_connector.connector:UCMConnectorV1.get_block_ids_with_load_errors
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_invalid_blocks_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.sfa_pd_rd2h.worker:SFAPDRD2HConsumerWorker.get_block_ids_with_load_errors
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_invalid_blocks_handler

# Mooncake V2 updates its gauge at receive admission, cancellation and
# completion. Completion is covered by mooncake_receive_stats_handler.
- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake.connector:MooncakeBaseConnector.update_state_after_alloc
  handler: vllm_ascend.observability.ms_metrics.handlers:mooncake_waiting_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake.connector:MooncakeBaseConnector._finish_request
  handler: vllm_ascend.observability.ms_metrics.handlers:mooncake_waiting_handler

# Other connectors are sampled before build_connector_meta drains their queue.
- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_connector:MooncakeConnectorScheduler.build_connector_meta
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_remote_waiting_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_layerwise_connector:MooncakeLayerwiseConnectorScheduler.build_connector_meta
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_remote_waiting_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.mooncake_hybrid_connector:MooncakeConnectorScheduler.build_connector_meta
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_remote_waiting_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_p2p.sfa_pd_rd2h.scheduler:SFAPDRD2HScheduler.build_connector_meta
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_remote_waiting_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.pool_scheduler:BaseKVPoolScheduler.build_connector_meta
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_transfer_remote_waiting_handler
